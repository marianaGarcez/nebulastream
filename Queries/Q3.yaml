# Q3 - Dynamic Speed Limit
# Reference: nebulastream-private MeosSNCBQuery3.cpp
#   query1 = from("highriskArea").filter(tedwithin(lon, lat, ts) == 1)
#   from("sncb").joinWith(query1).where(timestamp == highriskArea$timestamp)
#
#   The zone geometry, hidden inside the old tedwithin, is an explicit Polygon column.
#   NOTE: the inner SELECT projects the polygon away - a variable-sized Polygon
#   column cannot flow through a join (see nes-systests/demo/PolygonJoin.test).
# Deploy: nebucli -t Queries/Q3.yaml start

query: |
  SELECT ts, deviceid, gsp_speed, vbat, gps_lat, gps_lon
  FROM (SELECT * FROM sncb_stream)
  INNER JOIN (SELECT zts, hlon, hlat, ts FROM highrisk_zone
              WHERE edwithin_tgeo_geo(MovingPoint(hlon, hlat, ts), polygon, FLOAT64(0.01)))
  ON ts = zts
  WINDOW TUMBLING(ts, SIZE 600 ms)
  INTO Q3_SINK

sinks:
  - name: Q3_SINK
    host: localhost:8080
    type: File
    schema:
      - name: SNCB_STREAM$TS
        type: UINT64
      - name: SNCB_STREAM$DEVICEID
        type: UINT64
      - name: SNCB_STREAM$GSP_SPEED
        type: FLOAT64
      - name: SNCB_STREAM$VBAT
        type: FLOAT64
      - name: SNCB_STREAM$GPS_LAT
        type: FLOAT64
      - name: SNCB_STREAM$GPS_LON
        type: FLOAT64
    config:
      file_path: "Output/q3_dynamic_speed_limit.json"
      output_format: "JSON"
      append: "false"

logical:
  - name: sncb_stream
    schema:
      - name: ts
        type: UINT64
      - name: deviceid
        type: UINT64
      - name: vbat
        type: FLOAT64
      - name: pcfa_mbar
        type: FLOAT64
      - name: pcff_mbar
        type: FLOAT64
      - name: pcf1_mbar
        type: FLOAT64
      - name: pcf2_mbar
        type: FLOAT64
      - name: t1_mbar
        type: FLOAT64
      - name: t2_mbar
        type: FLOAT64
      - name: code1
        type: FLOAT64
      - name: code2
        type: FLOAT64
      - name: gsp_speed
        type: FLOAT64
      - name: gps_lat
        type: FLOAT64
      - name: gps_lon
        type: FLOAT64
  - name: highrisk_zone
    schema:
      - name: ts
        type: UINT64
      - name: zts
        type: UINT64
      - name: hlon
        type: FLOAT64
      - name: hlat
        type: FLOAT64
      - name: polygon
        type: Polygon

physical:
  - logical: sncb_stream
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
      fieldDelimiter: ","
    source_config:
      file_path: "nes-systests/testdata/small/sncb_demo.csv"
  - logical: highrisk_zone
    host: localhost:8080
    type: File
    parser_config:
      type: NestedJSON
    source_config:
      file_path: "Queries/data/highrisk_zone.jsonl"

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
