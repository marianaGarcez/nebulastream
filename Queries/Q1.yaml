# Q1 - Location-Based Alert Filtering
# Reference: nebulastream-private MeosSNCBQuery1.cpp
#   .filter(teintersects(lon, lat, ts) == 1 && (Code1 != 0 || Code2 != 0))
#   .window(SlidingWindow) .apply(Avg(speed))
# Deploy: nebucli -t Queries/Q1.yaml start

query: |
  SELECT start, end, AVG(gsp_speed) AS avg_speed
  FROM sncb_stream
  WHERE tgeo_at_stbox(MovingPoint(gps_lon, gps_lat, ts),
                      SpatioTemporalBox(FLOAT64(3.0), FLOAT64(4.0), FLOAT64(50.8), FLOAT64(51.4),
                                        UINT64(1722657600), UINT64(1722664800)))
    AND (code1 != FLOAT64(0.0) OR code2 != FLOAT64(0.0))
  WINDOW SLIDING(ts, SIZE 600 ms, ADVANCE BY 300 ms)
  INTO Q1_SINK

sinks:
  - name: Q1_SINK
    host: localhost:8080
    type: File
    schema:
      - name: SNCB_STREAM$START
        type: UINT64
      - name: SNCB_STREAM$END
        type: UINT64
      - name: SNCB_STREAM$AVG_SPEED
        type: FLOAT64
    config:
      file_path: "Output/q1_alert_filtering.json"
      output_format: "JSON"
      append: "false"

logical:
  - name: sncb_stream
    schema:
      - name: ts
        type: UINT64
      - name: deviceid
        type: UINT64
      - name: vbat
        type: FLOAT64
      - name: pcfa_mbar
        type: FLOAT64
      - name: pcff_mbar
        type: FLOAT64
      - name: pcf1_mbar
        type: FLOAT64
      - name: pcf2_mbar
        type: FLOAT64
      - name: t1_mbar
        type: FLOAT64
      - name: t2_mbar
        type: FLOAT64
      - name: code1
        type: FLOAT64
      - name: code2
        type: FLOAT64
      - name: gsp_speed
        type: FLOAT64
      - name: gps_lat
        type: FLOAT64
      - name: gps_lon
        type: FLOAT64

physical:
  - logical: sncb_stream
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
      fieldDelimiter: ","
    source_config:
      file_path: "nes-systests/testdata/small/sncb_demo.csv"

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
