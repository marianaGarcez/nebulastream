# Q2 - Location-Based Noise Monitoring
# Reference: nebulastream-private MeosSNCBQuery2.cpp
#   Original: .filter(tpointatstbox(...) == 1 && speed > 0 && PCFA_mbar > 0
#             && speed*0.5 + PCFA_mbar*0.5 > 2) .window(TumblingWindow) .apply(Max(PCFA_mbar))
#
#   Repurposed: the frontend's SoundQuery used to fabricate a "noise level" in JS
#   (speed*2, capped at 100, plus a client-side per-device speed-variation term).
#   This computes that formula's base term server-side instead, per-point rather
#   than windowed, so the frontend can overlay a real value on every path point.
#   The 100 cap and the variation term (which needs a per-device running average -
#   more join complexity than this demo query warrants) stay client-side as display-only.
#   NES has no LEAST/CASE support to express the cap here.
# Deploy: nebucli -t Queries/Q2.yaml start

query: |
  SELECT ts, deviceid, gps_lat, gps_lon, gsp_speed * FLOAT64(2.0) AS noise_level
  FROM sncb_stream
  INTO Q2_SINK

sinks:
  - name: Q2_SINK
    host: localhost:8080
    type: File
    schema:
      - name: SNCB_STREAM$TS
        type: UINT64
      - name: SNCB_STREAM$DEVICEID
        type: UINT64
      - name: SNCB_STREAM$GPS_LAT
        type: FLOAT64
      - name: SNCB_STREAM$GPS_LON
        type: FLOAT64
      - name: NOISE_LEVEL
        type: FLOAT64
    config:
      file_path: "Output/q2_noise_monitoring.json"
      output_format: "JSON"
      append: "false"

logical:
  - name: sncb_stream
    schema:
      - name: ts
        type: UINT64
      - name: deviceid
        type: UINT64
      - name: vbat
        type: FLOAT64
      - name: pcfa_mbar
        type: FLOAT64
      - name: pcff_mbar
        type: FLOAT64
      - name: pcf1_mbar
        type: FLOAT64
      - name: pcf2_mbar
        type: FLOAT64
      - name: t1_mbar
        type: FLOAT64
      - name: t2_mbar
        type: FLOAT64
      - name: code1
        type: FLOAT64
      - name: code2
        type: FLOAT64
      - name: gsp_speed
        type: FLOAT64
      - name: gps_lat
        type: FLOAT64
      - name: gps_lon
        type: FLOAT64

physical:
  - logical: sncb_stream
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
      fieldDelimiter: ","
    source_config:
      file_path: "nes-systests/testdata/small/sncb_demo.csv"

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
