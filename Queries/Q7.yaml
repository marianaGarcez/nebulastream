# Q7 - Unscheduled Stops
# Reference: nebulastream-private MeosSNCBQuery7.cpp
#   .filter(tpointatsworkshop(...) == 0)   -- OUTSIDE every workshop
#   .filter(speed < 0.002)
#
#   tpointatsworkshop has no equivalent; it is the negation of a disjunction of
#   tgeo_at_stbox over the Antwerp and Charleroi workshop boxes.
#   NOTE: `NOT <plugin call>` fails to deserialize; a disjunction serialises fine
#   (see nes-systests/demo/NotProbe.test).
# Deploy: nebucli -t Queries/Q7.yaml start

query: |
  SELECT ts, deviceid, gsp_speed, gps_lat, gps_lon
  FROM sncb_stream
  WHERE gsp_speed < FLOAT64(0.002)
    AND NOT (tgeo_at_stbox(MovingPoint(gps_lon, gps_lat, ts), SpatioTemporalBox(FLOAT64(4.43), FLOAT64(4.45), FLOAT64(51.21), FLOAT64(51.24), UINT64(1722657600), UINT64(1722664800)))
             OR tgeo_at_stbox(MovingPoint(gps_lon, gps_lat, ts), SpatioTemporalBox(FLOAT64(4.52), FLOAT64(4.55), FLOAT64(50.41), FLOAT64(50.43), UINT64(1722657600), UINT64(1722664800))))
  INTO Q7_SINK

sinks:
  - name: Q7_SINK
    host: localhost:8080
    type: File
    schema:
      - name: SNCB_STREAM$TS
        type: UINT64
      - name: SNCB_STREAM$DEVICEID
        type: UINT64
      - name: SNCB_STREAM$GSP_SPEED
        type: FLOAT64
      - name: SNCB_STREAM$GPS_LAT
        type: FLOAT64
      - name: SNCB_STREAM$GPS_LON
        type: FLOAT64
    config:
      file_path: "Output/q7_unscheduled_stops.json"
      output_format: "JSON"
      append: "false"

logical:
  - name: sncb_stream
    schema:
      - name: ts
        type: UINT64
      - name: deviceid
        type: UINT64
      - name: vbat
        type: FLOAT64
      - name: pcfa_mbar
        type: FLOAT64
      - name: pcff_mbar
        type: FLOAT64
      - name: pcf1_mbar
        type: FLOAT64
      - name: pcf2_mbar
        type: FLOAT64
      - name: t1_mbar
        type: FLOAT64
      - name: t2_mbar
        type: FLOAT64
      - name: code1
        type: FLOAT64
      - name: code2
        type: FLOAT64
      - name: gsp_speed
        type: FLOAT64
      - name: gps_lat
        type: FLOAT64
      - name: gps_lon
        type: FLOAT64

physical:
  - logical: sncb_stream
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
      fieldDelimiter: ","
    source_config:
      file_path: "nes-systests/testdata/small/sncb_demo.csv"

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
