# Q4 - Weather-Based Speed Zones
# Reference: nebulastream-private MeosSNCBQuery4.cpp
#   weatherQuery = from("weather").filter(tedwithin(...)==1)
#     .filter(temperature < 12.0 || temperature > 16.0)
#     .filter(snowfall >= 0.0 || wind_speed > 15.0 || precipitation > 0.1)
#     .map(adjusted_speed_limit = 15.0)
#   from("sncb").joinWith(weatherQuery).where(timestamp == weather$timestamp)
# Deploy: nebucli -t Queries/Q4.yaml start

query: |
  SELECT ts, deviceid, gsp_speed, temperature, FLOAT64(15.0) AS adjusted_speed_limit
  FROM (SELECT * FROM sncb_stream)
  INNER JOIN (SELECT wts, ts, temperature FROM weather
              WHERE edwithin_tgeo_geo(MovingPoint(wlon, wlat, ts), polygon, FLOAT64(0.01))
                AND (temperature < FLOAT64(12.0) OR temperature > FLOAT64(16.0))
                AND (snowfall >= FLOAT64(0.0) OR wind_speed > FLOAT64(15.0) OR precipitation > FLOAT64(0.1)))
  ON ts = wts
  WINDOW TUMBLING(ts, SIZE 600 ms)
  INTO Q4_SINK

sinks:
  - name: Q4_SINK
    host: localhost:8080
    type: File
    schema:
      - name: SNCB_STREAM$TS
        type: UINT64
      - name: SNCB_STREAM$DEVICEID
        type: UINT64
      - name: SNCB_STREAM$GSP_SPEED
        type: FLOAT64
      - name: WEATHER$TEMPERATURE
        type: FLOAT64
      - name: ADJUSTED_SPEED_LIMIT
        type: FLOAT64
    config:
      file_path: "Output/q4_weather_speed_zones.json"
      output_format: "JSON"
      append: "false"

logical:
  - name: sncb_stream
    schema:
      - name: ts
        type: UINT64
      - name: deviceid
        type: UINT64
      - name: vbat
        type: FLOAT64
      - name: pcfa_mbar
        type: FLOAT64
      - name: pcff_mbar
        type: FLOAT64
      - name: pcf1_mbar
        type: FLOAT64
      - name: pcf2_mbar
        type: FLOAT64
      - name: t1_mbar
        type: FLOAT64
      - name: t2_mbar
        type: FLOAT64
      - name: code1
        type: FLOAT64
      - name: code2
        type: FLOAT64
      - name: gsp_speed
        type: FLOAT64
      - name: gps_lat
        type: FLOAT64
      - name: gps_lon
        type: FLOAT64
  - name: weather
    schema:
      - name: ts
        type: UINT64
      - name: wts
        type: UINT64
      - name: wlon
        type: FLOAT64
      - name: wlat
        type: FLOAT64
      - name: temperature
        type: FLOAT64
      - name: snowfall
        type: FLOAT64
      - name: wind_speed
        type: FLOAT64
      - name: precipitation
        type: FLOAT64
      - name: polygon
        type: Polygon

physical:
  - logical: sncb_stream
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
      fieldDelimiter: ","
    source_config:
      file_path: "nes-systests/testdata/small/sncb_demo.csv"
  - logical: weather
    host: localhost:8080
    type: File
    parser_config:
      type: NestedJSON
    source_config:
      file_path: "Queries/data/weather.jsonl"

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
