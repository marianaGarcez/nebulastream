# Q5 - Battery Monitoring
# Reference: nebulastream-private MeosSNCBQuery5.cpp
#   .filter(distancetpointstbox(lon, lat, ts) < 3 && Vbat < 30.0 && speed > 0.0)
#
#   The workshop area IS the SpatioTemporalBox given to nad_tgeo_stbox, so the
#   distance test and the proximity test collapse into one predicate (Antwerp box).
# Deploy: nebucli -t Queries/Q5.yaml start

query: |
  SELECT ts, deviceid, vbat, gsp_speed,
         nad_tgeo_stbox(MovingPoint(gps_lon, gps_lat, ts), SpatioTemporalBox(FLOAT64(4.43), FLOAT64(4.45), FLOAT64(51.21), FLOAT64(51.24), UINT64(1722657600), UINT64(1722664800))) AS dist_to_workshop
  FROM sncb_stream
  WHERE nad_tgeo_stbox(MovingPoint(gps_lon, gps_lat, ts), SpatioTemporalBox(FLOAT64(4.43), FLOAT64(4.45), FLOAT64(51.21), FLOAT64(51.24), UINT64(1722657600), UINT64(1722664800))) < FLOAT64(3.0)
    AND vbat < FLOAT64(30.0) AND gsp_speed > FLOAT64(0.0)
  INTO Q5_SINK

sinks:
  - name: Q5_SINK
    host: localhost:8080
    type: File
    schema:
      - name: SNCB_STREAM$TS
        type: UINT64
      - name: SNCB_STREAM$DEVICEID
        type: UINT64
      - name: SNCB_STREAM$VBAT
        type: FLOAT64
      - name: SNCB_STREAM$GSP_SPEED
        type: FLOAT64
      - name: DIST_TO_WORKSHOP
        type: FLOAT64
    config:
      file_path: "Output/q5_battery_monitoring.json"
      output_format: "JSON"
      append: "false"

logical:
  - name: sncb_stream
    schema:
      - name: ts
        type: UINT64
      - name: deviceid
        type: UINT64
      - name: vbat
        type: FLOAT64
      - name: pcfa_mbar
        type: FLOAT64
      - name: pcff_mbar
        type: FLOAT64
      - name: pcf1_mbar
        type: FLOAT64
      - name: pcf2_mbar
        type: FLOAT64
      - name: t1_mbar
        type: FLOAT64
      - name: t2_mbar
        type: FLOAT64
      - name: code1
        type: FLOAT64
      - name: code2
        type: FLOAT64
      - name: gsp_speed
        type: FLOAT64
      - name: gps_lat
        type: FLOAT64
      - name: gps_lon
        type: FLOAT64

physical:
  - logical: sncb_stream
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
      fieldDelimiter: ","
    source_config:
      file_path: "nes-systests/testdata/small/sncb_demo.csv"

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
